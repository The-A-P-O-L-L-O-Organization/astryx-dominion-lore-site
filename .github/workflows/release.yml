name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate release notes
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          toTag: ${{ github.ref_name }}
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}$NEWLINE$NEWLINE## What's Changed$NEWLINE{{CHANGELOG}}$NEWLINE$NEWLINE**Full changelog**: {{RELEASELINK}}",
              "categories": [
                {"title": "## Features", "labels": ["feat"]},
                {"title": "## Bug Fixes", "labels": ["fix"]},
                {"title": "## Documentation", "labels": ["docs"]},
                {"title": "## Maintenance", "labels": ["chore", "ci", "refactor", "test"]}
              ],
              "label_extractor": [
                {"pattern": "(\\w+)(?:\\(.+\\))?!?:\\s.*", "target": "$1"}
              ],
              "duplicate_filter": true
            }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          generate_release_notes: false
